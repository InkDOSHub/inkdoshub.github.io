<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/inkdoshub-icone-32.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/inkdoshub-icone-192.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/inkdoshub-icone-180.png?v=5">
<title>Music · InkDOS Hub</title>
<script src="../../assets/tema.js?v=1"></script>
<script src="../../assets/idioma.js?v=1"></script>
<script src="../../assets/gerenciador-app.js?v=7"></script>
<link rel="stylesheet" href="../../assets/barra.css?v=2">
<link rel="stylesheet" href="../../assets/midia.css?v=3">
<style>
  .agora{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px clamp(16px,4vw,48px);min-height:0}
  .capa{width:min(220px,36vh);aspect-ratio:1;border-radius:18px;background:color-mix(in srgb,#7655c7 14%,var(--card));border:1px solid var(--border);display:grid;place-items:center;align-self:center;overflow:hidden}
  .capa svg{width:42%;height:42%;fill:none;stroke:#7655c7;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .capa img{width:100%;height:100%;object-fit:cover}
  .faixa{text-align:center;min-width:0}
  .faixa strong{display:block;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .faixa small{display:block;margin-top:4px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  audio{width:100%;max-width:560px;align-self:center}
  #eq{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;margin:6px 0 4px}
  #eq div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  #eq input{writing-mode:vertical-lr;direction:rtl;width:26px;height:120px;accent-color:var(--accent)}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .ajustes{max-height:46%}
</style>
</head>
<body class="ink-app" data-idioma>
<header class="ink-bar">
  <a class="ink-home" href="../../" data-icone="voltar">InkDOS Hub</a>
  <span class="ink-title">Music</span>
  <span class="ink-spacer"></span>
  <button class="ink-btn" type="button" data-idioma-botao data-icone="idioma" title="Language" aria-label="Language"></button>
  <button class="ink-btn" id="abrir">Open music</button>
  <button class="ink-btn" id="aleat" title="Shuffle" aria-label="Shuffle" data-icone="aleatorio"></button>
  <button class="ink-btn" id="rep" title="Repeat" aria-label="Repeat" data-icone="repetir"></button>
  <button class="ink-btn" id="bajustes">Audio settings</button>
</header>
<main class="ink-main">
  <div class="md-vazio"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><h2>No music open</h2><p>Open an audio file to play it here.</p><button class="ink-btn" type="button" onclick="document.getElementById('abrir').click()">Open music</button></div>
  <div class="md-wrap">
    <section class="md-stage">
      <div class="agora">
        <div class="capa" id="capa"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
        <div class="faixa" data-idioma-nao><strong id="titulo">No music</strong><small id="sub"></small></div>
        <audio id="audio" controls preload="metadata"></audio>
      </div>
      <section class="md-panel ajustes md-hide" id="ajustes">
        <h3 title="These settings are saved on this device and apply to all songs.">Equalizer</h3>
        <div class="presets" id="presets" data-idioma-nao></div>
        <div id="eq" data-idioma-nao></div>
        <div class="md-row"><label for="ganho">Extra volume</label><input type="range" id="ganho" min="-12" max="12" step="1" value="0"><output id="oganho" data-idioma-nao>0 dB</output></div>
        <div class="md-row"><label for="bal">Balance</label><input type="range" id="bal" min="-1" max="1" step="0.1" value="0"><output id="obal" data-idioma-nao>center</output></div>
        <div class="md-row"><label for="vel">Speed</label><input type="range" id="vel" min="0.5" max="2" step="0.05" value="1"><output id="ovel" data-idioma-nao>1.00×</output></div>
              </section>
    </section>
    <aside class="md-side">
      <h2><span>Playlist</span><button class="ink-btn" id="limpar">Clear</button></h2>
      <ul class="md-list" id="lista" data-idioma-nao></ul>
    </aside>
  </div>
</main>
<input id="arquivos" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.opus" multiple hidden>
<script src="../../assets/midia.js?v=2"></script>
<script src="../../assets/icones.js?v=2"></script>
<script src="app.js?v=6"></script>
</body>
</html>

<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Música · InkTerminal</title>
<script src="../../assets/tema.js?v=1"></script>
<script src="../../assets/gerenciador-app.js?v=6"></script>
<link rel="stylesheet" href="../../assets/barra.css?v=2">
<link rel="stylesheet" href="../../assets/midia.css?v=2">
<style>
  .agora{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px clamp(16px,4vw,48px);min-height:0}
  .capa{width:min(220px,36vh);aspect-ratio:1;border-radius:18px;background:color-mix(in srgb,#7655c7 14%,var(--card));border:1px solid var(--border);display:grid;place-items:center;align-self:center;overflow:hidden}
  .capa svg{width:42%;height:42%;fill:none;stroke:#7655c7;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .capa img{width:100%;height:100%;object-fit:cover}
  .faixa{text-align:center;min-width:0}
  .faixa strong{display:block;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .faixa small{display:block;margin-top:4px;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  audio{width:100%;max-width:720px;align-self:center}
  .ctl{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
  .ctl .ink-btn{min-width:48px;min-height:40px}
  .ctl #tocar{min-width:64px}
  #eq{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px;align-items:end;margin:6px 0 4px}
  #eq div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
  #eq input{writing-mode:vertical-lr;direction:rtl;width:26px;height:120px;accent-color:var(--accent)}
  .presets{display:flex;gap:6px;flex-wrap:wrap}
  .ajustes{max-height:46%}
</style>
</head>
<body class="ink-app">
<header class="ink-bar">
  <a class="ink-home" href="../../" data-icone="voltar">InkTerminal</a>
  <span class="ink-title">Música</span>
  <span class="ink-spacer"></span>
  <button class="ink-btn" id="abrir">Abrir músicas</button>
  <button class="ink-btn" id="bajustes">Ajustes de áudio</button>
</header>
<main class="ink-main">
  <div class="md-wrap">
    <section class="md-stage">
      <div class="agora">
        <div class="capa" id="capa"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></div>
        <div class="faixa"><strong id="titulo">Nenhuma música</strong><small id="sub">Toque em Abrir músicas para escolher arquivos do iPad</small></div>
        <audio id="audio" controls preload="metadata"></audio>
        <div class="ctl">
          <button class="ink-btn" id="ant" title="Anterior" aria-label="Anterior" data-icone="faixa-anterior"></button>
          <button class="ink-btn" id="tocar" title="Tocar ou pausar" aria-label="Tocar ou pausar" data-icone="play"></button>
          <button class="ink-btn" id="prox" title="Próxima" aria-label="Próxima" data-icone="faixa-proxima"></button>
          <button class="ink-btn" id="aleat" title="Ordem aleatória" aria-label="Ordem aleatória" data-icone="aleatorio"></button>
          <button class="ink-btn" id="rep" title="Repetir" aria-label="Repetir" data-icone="repetir"></button>
        </div>
      </div>
      <section class="md-panel ajustes md-hide" id="ajustes">
        <h3>Equalizador</h3>
        <div class="presets" id="presets"></div>
        <div id="eq"></div>
        <div class="md-row"><label for="ganho">Volume extra</label><input type="range" id="ganho" min="-12" max="12" step="1" value="0"><output id="oganho">0 dB</output></div>
        <div class="md-row"><label for="bal">Balanço</label><input type="range" id="bal" min="-1" max="1" step="0.1" value="0"><output id="obal">centro</output></div>
        <div class="md-row"><label for="vel">Velocidade</label><input type="range" id="vel" min="0.5" max="2" step="0.05" value="1"><output id="ovel">1,00×</output></div>
        <p class="md-note">Os ajustes ficam salvos neste aparelho e valem para todas as músicas.</p>
      </section>
    </section>
    <aside class="md-side">
      <h2><span>Lista de reprodução</span><button class="ink-btn" id="limpar">Limpar</button></h2>
      <ul class="md-list" id="lista"></ul>
    </aside>
  </div>
</main>
<input id="arquivos" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.ogg,.oga,.flac,.opus" multiple hidden>
<script src="../../assets/midia.js?v=1"></script>
<script src="../../assets/icones.js?v=1"></script>
<script src="app.js?v=2"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/inkdoshub-icone-32.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/inkdoshub-icone-192.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/inkdoshub-icone-180.png?v=5">
<title>Video · InkDOS Hub</title>
<script src="../../assets/tema.js?v=1"></script>
<script src="../../assets/idioma.js?v=1"></script>
<script src="../../assets/gerenciador-app.js?v=10"></script>
<link rel="stylesheet" href="../../assets/barra.css?v=4">
<script src="../../assets/barra.js?v=2" defer></script>
<link rel="stylesheet" href="../../assets/midia.css?v=3">
<style>
  .tela{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;position:relative}
  video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
  /* controles próprios, no formato da barra da Música (os nativos não respondem no XeOS) */
  .controle{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--border)}
  .controle .ink-btn{width:34px;height:34px;padding:0;display:grid;place-items:center}
  .controle svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .c-tempo{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
  #c-barra{flex:1;min-width:60px;accent-color:var(--accent)}
  .info{display:flex;align-items:center;gap:10px;padding:8px 16px;font-size:13px;min-height:44px;box-sizing:border-box}
  .info strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info small{color:var(--muted)}
  #progresso{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:10}
  #progresso.on{display:flex}
  #progresso .caixa{background:var(--card);color:var(--text);border-radius:12px;padding:18px;width:min(380px,calc(100% - 32px));display:flex;flex-direction:column;gap:10px}
  #progresso .barra{height:8px;border-radius:4px;background:var(--border);overflow:hidden}
  #progresso .barra span{display:block;height:100%;width:0;background:var(--accent)}
  #progresso .botoes{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  #progresso p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
  #progresso .principal{background:var(--accent);border-color:var(--accent);color:#0d1117;font-weight:600}
</style>
</head>
<body class="ink-app" data-idioma>
<header class="ink-bar">
  <a class="ink-home" href="../../" data-icone="voltar">InkDOS Hub</a>
  <span class="ink-title">Video</span>
  <span class="ink-spacer"></span>
  <button class="ink-btn" id="abrir">Open videos</button>
  <button class="ink-btn" id="editar" disabled>Edit</button>
  <button class="ink-btn" id="extrair" title="Keeps only the sound of a video (.m4a) in Music. The video is not stored here.">Extract sound</button>
  <button class="ink-btn" id="blista">List</button>
</header>
<main class="ink-main">
  <div class="md-vazio"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="m17 10 5-3v10l-5-3"/></svg><h2>No video open</h2><p>Open a video file to watch it here.</p><button class="ink-btn" type="button" onclick="document.getElementById('abrir').click()">Open videos</button></div>
  <div class="md-wrap">
    <section class="md-stage">
      <div class="tela">
        <video id="video" playsinline preload="metadata"></video>
      </div>
      <div class="controle" id="controle">
        <button class="ink-btn" id="c-play" type="button" title="Play or pause" aria-label="Play or pause"></button>
        <span class="c-tempo" id="c-tempo" data-idioma-nao>0:00 / 0:00</span>
        <input type="range" id="c-barra" min="0" max="1000" value="0" step="1" aria-label="Position">
        <button class="ink-btn" id="c-som" type="button" title="Mute" aria-label="Mute"></button>
        <button class="ink-btn" id="c-tela" type="button" title="Full screen" aria-label="Full screen"><svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
      </div>
      <div class="info"><strong id="titulo" data-idioma-nao>No video</strong><small id="sub"></small>
      </div>
    </section>
    <aside class="md-side" id="lado">
      <h2><span>Videos</span><button class="ink-btn" id="limpar">Clear</button></h2>
      <ul class="md-list" id="lista" data-idioma-nao></ul>
    </aside>
  </div>
</main>
<input id="arquivos" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" multiple hidden>
<input id="arquivo-som" type="file" accept="video/*,.mp4,.mov,.m4v,.webm,.mkv" hidden>
<div id="progresso" role="dialog" aria-live="polite" data-idioma-nao><div class="caixa">
  <strong id="p-titulo"></strong>
  <p id="p-texto"></p>
  <div class="barra" id="p-barra"><span></span></div>
  <div class="botoes" id="p-botoes"></div>
</div></div>
<script src="../../assets/midia.js?v=3"></script>
<script src="../../assets/icones.js?v=2"></script>
<script src="app.js?v=12"></script>
</body>
</html>

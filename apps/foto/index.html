<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" sizes="32x32" href="../../assets/inkdoshub-icone-32.png?v=5">
<link rel="icon" type="image/png" sizes="192x192" href="../../assets/inkdoshub-icone-192.png?v=5">
<link rel="apple-touch-icon" sizes="180x180" href="../../assets/inkdoshub-icone-180.png?v=5">
<title>Photos · InkDOS Hub</title>
<script src="../../assets/tema.js?v=1"></script>
<script src="../../assets/idioma.js?v=1"></script>
<link rel="stylesheet" href="../../assets/barra.css?v=4">
<script src="../../assets/barra.js?v=3" defer></script>
<link rel="stylesheet" href="../../assets/midia.css?v=3">
<style>
  .grade{flex:1;overflow:auto;padding:12px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px;align-content:start;-webkit-overflow-scrolling:touch}
  .grade button{position:relative;padding:0;border:0;border-radius:6px;overflow:hidden;background:var(--card);aspect-ratio:1;cursor:pointer}
  .grade img{width:100%;height:100%;object-fit:cover;display:block}
  .ver{flex:1;min-height:0;overflow:auto;background:#000;display:flex;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y}
  .ver img{margin:auto;display:block;user-select:none;-webkit-user-select:none}
  .ver.ajustar img{width:100%;height:100%;object-fit:contain;margin:0}
  .ver img{flex:none}
  .info{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--card);border-top:1px solid var(--border);font-size:14px;min-height:44px;box-sizing:border-box}
  .info strong{flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .info small{color:var(--muted)}
  #edicao{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:5}
  #edicao .ink-bar{border-top:0}
  .fe-palco{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none}
  .fe-moldura{position:relative}
  .fe-moldura canvas{display:block;width:100%;height:100%}
  .fe-recorte{position:absolute;box-sizing:border-box;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;touch-action:none;
    background-image:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35)),linear-gradient(90deg,rgba(255,255,255,.35),rgba(255,255,255,.35));
    background-size:100% 1px,100% 1px,1px 100%,1px 100%;background-position:0 33.33%,0 66.66%,33.33% 0,66.66% 0;background-repeat:no-repeat}
  .fe-recorte i{position:absolute;width:26px;height:26px;border:0 solid #fff}
  .fe-recorte i[data-c="nw"]{left:-4px;top:-4px;border-width:4px 0 0 4px;cursor:nwse-resize}
  .fe-recorte i[data-c="ne"]{right:-4px;top:-4px;border-width:4px 4px 0 0;cursor:nesw-resize}
  .fe-recorte i[data-c="sw"]{left:-4px;bottom:-4px;border-width:0 0 4px 4px;cursor:nesw-resize}
  .fe-recorte i[data-c="se"]{right:-4px;bottom:-4px;border-width:0 4px 4px 0;cursor:nwse-resize}
  .fe-painel{border-top:1px solid var(--border);background:var(--card);padding:8px 14px 12px;max-height:45%;overflow:auto;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  .fe-abas,.fe-linha{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
  .fe-abas{justify-content:center}
</style>
</head>
<body class="ink-app" data-idioma>
<header class="ink-bar">
  <a class="ink-home" href="../../" data-icone="voltar">InkDOS Hub</a>
  <span class="ink-title">Photos</span>
  <span class="ink-status" id="status" data-idioma-nao></span>
  <span class="ink-spacer"></span>
  <button class="ink-btn" id="abrir">Open photos</button>
  <button class="ink-btn md-hide" id="partilhar">Save</button>
  <button class="ink-btn md-hide" id="editar">Edit</button>
  <button class="ink-btn md-hide" id="apagar" title="Remove from this gallery">Remove</button>
  <button class="ink-btn" id="limpar" title="Remove all photos from this gallery">Clear</button>
</header>
<main class="ink-main">
  <div class="md-vazio"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><h2>No photo open</h2><p>Open an image file to see it here.</p><button class="ink-btn" type="button" onclick="document.getElementById('abrir').click()">Open photos</button></div>
  <div class="md-wrap">
    <section class="md-stage" id="tgrade">
      <div class="grade" id="grade" data-idioma-nao></div>
    </section>
    <section class="md-stage md-hide" id="tver">
      <div class="ver ajustar" id="ver" data-idioma-nao><img id="foto" alt=""></div>
      <div class="info">
        <button class="ink-btn" id="bgrade" title="Library" aria-label="Library" data-icone="voltar"></button>
        <strong id="titulo" data-idioma-nao></strong><small id="sub" data-idioma-nao></small>
      </div>
    </section>
  </div>
  <div id="edicao" class="md-hide"></div>
</main>
<input id="arquivos" type="file" accept="image/*" multiple hidden>
<script src="../../assets/midia.js?v=3"></script>
<script src="../../assets/icones.js?v=2"></script>
<script src="../../assets/gerenciador-app.js?v=14"></script>
<script src="editor.js?v=2"></script>
<script src="app.js?v=11"></script>
</body>
</html>

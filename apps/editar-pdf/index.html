<style>
  main{flex:1;min-height:0;overflow:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
  .busca{display:block;box-sizing:border-box;width:100%;max-width:980px;margin:0 auto 14px;height:40px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--text);font:inherit;font-size:15px;-webkit-appearance:none;appearance:none}
  .grade{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .grade a{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border:1px solid var(--border);border-radius:14px;background:var(--card);color:var(--text);font-size:14px;font-weight:600;text-decoration:none;-webkit-tap-highlight-color:transparent}
  .grade a:active{background:var(--btn-active)}
  .grade svg{flex:0 0 auto;width:24px;height:24px;fill:currentColor;opacity:.82}
  main [hidden]{display:none!important}
  .caixas{max-width:980px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .caixa{border:1px solid var(--border);border-radius:14px;background:var(--card)}
  .caixa[open]{grid-column:1/-1}
  .caixa summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;-webkit-tap-highlight-color:transparent}
  .caixa summary::-webkit-details-marker{display:none}
  .caixa summary small{display:block;margin-top:2px;font-weight:400;color:var(--muted)}
  .caixa .grade{padding:0 10px 10px}
  .caixa .grade a,.busca-res a{min-height:44px;font-weight:500}
  .pacote{max-width:980px;margin:14px auto 0;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
  .pacote button{margin-left:auto;height:32px;padding:0 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-weight:600}
  .pacote details.i .pop{left:0;right:auto}
  h2{max-width:980px;margin:22px auto 10px;font-size:13px;font-weight:600;color:var(--muted)}
  details.i.solto .pop{left:auto;right:0;top:30px;bottom:auto}
  .ink-bar details.i.solto{position:static}
  .vazio{max-width:980px;margin:12px auto;color:var(--muted)}
</style>

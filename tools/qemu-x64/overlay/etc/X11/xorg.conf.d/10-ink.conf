Section "ServerFlags"
  Option "BlankTime" "0"
  Option "StandbyTime" "0"
  Option "SuspendTime" "0"
  Option "OffTime" "0"
EndSection
Section "Device"
  Identifier "card"
  Driver "fbdev"
  Option "fbdev" "/dev/fb0"
EndSection
Section "Screen"
  Identifier "screen"
  Device "card"
  DefaultDepth 24
  SubSection "Display"
    Modes "1024x768"
  EndSubSection
EndSection
Section "InputClass"
  Identifier "flat pointer"
  MatchIsPointer "on"
  Option "AccelProfile" "flat"
EndSection

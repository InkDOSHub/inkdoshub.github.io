<!-- InkTerminal: segue o tema do InkTerminal e usa português (cookie "config" do miniPaint) -->
<script>(function(){var t;try{t=localStorage.getItem("inkterminal-tema")}catch(_){}if(t!=="light"&&t!=="dark")t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";var m=document.cookie.match(/(?:^|; )config=([^;]*)/),c={};try{if(m)c=JSON.parse(m[1])}catch(_){}c.theme=t;if(!c.language)c.language="pt";document.cookie="config="+JSON.stringify(c)+"; max-age=15552000"})();</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<title>Webapp</title>
<script src="../assets/tema.js?v=1"></script>
<script src="../assets/idioma.js?v=1"></script>
<link rel="stylesheet" href="../assets/home.css?v=9">
<style>
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;min-height:0}
.barra{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:var(--card);border-bottom:1px solid var(--border);font-size:13px}
.barra a{padding:6px 10px;border-radius:8px;border:1px solid var(--border);background:var(--pill-bg);font-weight:600;white-space:nowrap}
.barra strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dica{padding:6px 12px;background:var(--pill-bg);color:var(--muted);font-size:12.5px;line-height:1.4}
.dica[hidden]{display:none}
iframe{flex:1;width:100%;border:0;background:#fff}
</style>
</head>
<body data-idioma>
<div class="barra">
  <a href="../">‹ Hub</a>
  <strong id="nome" data-idioma-nao></strong>
  <a id="fora" href="#" target="_blank" rel="noopener noreferrer">Open outside</a>
</div>
<p class="dica" id="dica">Blank page or an error? This site does not allow being shown inside the Hub. Use Open outside.</p>
<iframe id="moldura" title="Webapp" referrerpolicy="no-referrer" allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen></iframe>
<script>
/* Abre um webapp da pessoa (inicio/meus-apps.js) dentro do Hub, numa moldura. Muitos sites proíbem
   isso (X-Frame-Options/CSP) e o navegador não conta para a página quando bloqueia; por isso o aviso
   fica visível uns segundos e o botão "Open outside" fica sempre na barra.
   Só abre endereços guardados num cartão, nunca outro. */
(function () {
  var t = window.InkIdioma ? InkIdioma.t : function (s) { return s; };
  var alvo = "", app = null;
  try { alvo = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  try { app = JSON.parse(localStorage.getItem("inkdoshub-meus-apps") || "[]").filter(function (a) { return a && (a.ir === alvo || a.url === alvo); })[0]; } catch (_) {}
  if (!app || !/^https?:\/\//.test(alvo)) { document.getElementById("dica").textContent = t("Unknown address."); return; }
  document.getElementById("nome").textContent = app.nome;
  document.title = app.nome + " · InkDOS Hub";
  document.getElementById("fora").href = alvo;
  document.getElementById("moldura").src = alvo;
  setTimeout(function () { document.getElementById("dica").hidden = true; }, 8000);
})();
</script>
</body>
</html>

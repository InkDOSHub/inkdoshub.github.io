<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Opening…</title>
<style>html{color-scheme:light dark}body{margin:0;min-height:100vh;display:grid;place-items:center;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#697486}</style>
</head>
<body>
<p id="msg">Opening…</p>
<script>
/* Ponte para os webapps (abre na mesma aba) da pessoa (meus-apps.js). O iOS só troca o site pelo app nativo
   (universal link) quando a pessoa toca num link; um redirecionamento feito pela página, um instante
   depois, costuma ficar no Safari. Só vai para endereços guardados no cartão, nunca para outro. */
(function () {
  var alvo = "";
  try { alvo = decodeURIComponent(location.hash.slice(1)); } catch (_) {}
  // confere só o site (o cartão acrescenta parâmetros como "noapp" e "app=desktop", veja meus-apps.js)
  function site(x) { try { var u = new URL(x); return /^https?:$/.test(u.protocol) ? u.hostname.replace(/^(www|m)\./, "") : ""; } catch (_) { return ""; } }
  var ok = false, s = site(alvo);
  try { ok = !!s && JSON.parse(localStorage.getItem("inkdoshub-meus-apps") || "[]").some(function (a) { return a && (site(a.url) === s || site(a.ir) === s); }); } catch (_) {}
  if (!ok || !/^https?:\/\//.test(alvo)) { document.getElementById("msg").textContent = "Unknown address."; return; }
  setTimeout(function () { location.replace(alvo); }, 60);
})();
</script>
</body>
</html>

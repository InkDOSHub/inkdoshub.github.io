name: InkDOS Hub para Windows
# Monta o app (Electron oficial enxuto + windows/hub) e o instalador, e publica na release "hub-windows" com o SHA-256.
# Toda semana também, para pegar a versão nova do Electron (correções de segurança do Chromium).
on:
  push:
    branches: [main]
    paths: [windows/hub/**, .github/workflows/windows-hub.yml]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-hub
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar (Electron enxuto + app)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./windows/hub/montar.ps1 -Saida saida
      - name: Instalador e versão portátil
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Qp "/DOrigem=$PWD\saida\InkDOS Hub" "/DVersao=$env:HUB_VERSAO" "/O$PWD\saida" windows\hub\instalador.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup falhou' }
          Compress-Archive "saida\InkDOS Hub" saida\InkDOSHub-Windows-portatil.zip -CompressionLevel Optimal
          Get-ChildItem saida -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: InkDOSHub-Windows
          path: |
            saida/InkDOSHub-Setup.exe
            saida/InkDOSHub-Windows-portatil.zip
      - name: Publicar na release hub-windows
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd saida
          gh release view hub-windows >/dev/null 2>&1 || gh release create hub-windows --title "InkDOS Hub for Windows" --latest=false --notes "InkDOS Hub for Windows 10/11 (64-bit)."
          sha256sum InkDOSHub-Setup.exe > InkDOSHub-Setup.exe.sha256
          sha256sum InkDOSHub-Windows-portatil.zip > InkDOSHub-Windows-portatil.zip.sha256
          cat *.sha256
          gh release upload hub-windows InkDOSHub-Setup.exe InkDOSHub-Setup.exe.sha256 InkDOSHub-Windows-portatil.zip InkDOSHub-Windows-portatil.zip.sha256 --clobber
          # o lançador antigo (WinForms) sai da release
          gh release delete-asset hub-windows InkDOSHub.exe -y 2>/dev/null || true
          gh release delete-asset hub-windows InkDOSHub.exe.sha256 -y 2>/dev/null || true
          gh release edit hub-windows --notes "InkDOS Hub for Windows 10/11 (64-bit): the same apps as the website in their own windows, saved on the PC when you choose (each file checked by SHA-256), no telemetry. Version $HUB_VERSAO, Electron $ELECTRON_VERSAO (official build, trimmed). Install: InkDOSHub-Setup.exe (no admin). Source: windows/hub/ (MIT)."
          cd .. && git push -f origin "HEAD:refs/tags/hub-windows"

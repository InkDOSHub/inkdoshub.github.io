name: Transfer app for Windows
# Builds windows/transferir/ (a single .exe) and publishes it to the "transferir-windows" release,
# which the site's Transfer app offers for download.
on:
  push:
    branches: [main, 'claude/**']
    paths: [windows/transferir/**, .github/workflows/transferir-windows.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: transferir-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: App
        run: dotnet build windows/transferir/InkDOSHubTransferir.csproj -c Release -o out
      - name: File
        shell: pwsh
        run: |
          Copy-Item "out/InkDOS Hub Transferir.exe" InkDOSHub-Transferir.exe
          Get-ChildItem out | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: InkDOSHub-Transferir
          path: InkDOSHub-Transferir.exe
      - name: Publish to the release transferir-windows
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view transferir-windows >/dev/null 2>&1 || gh release create transferir-windows --title "InkDOS Hub Transferir for Windows" --latest=false --notes "Fast phone <-> PC file transfer without internet, server or admin. Source: windows/transferir/ (MIT)."
          sha256sum InkDOSHub-Transferir.exe > InkDOSHub-Transferir.exe.sha256
          cat InkDOSHub-Transferir.exe.sha256
          gh release upload transferir-windows InkDOSHub-Transferir.exe InkDOSHub-Transferir.exe.sha256 --clobber
          git push -f origin "HEAD:refs/tags/transferir-windows"

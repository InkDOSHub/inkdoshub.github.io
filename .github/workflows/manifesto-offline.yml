name: Atualizar lista da cópia offline
# Recria inicio/manifesto.json quando arquivos do site mudam no main.
on:
  push:
    branches: [main]
    paths-ignore: [inicio/manifesto.json]
  workflow_dispatch:

# Sem permissão de escrita no nível do workflow.
permissions:
  contents: read

concurrency:
  group: manifesto-offline
  cancel-in-progress: false

jobs:
  gerar:
    # Só no site publicado; o espelho recebe o resultado pela sincronização.
    if: ${{ !startsWith(github.repository, 'vfydr2m9wk-ops/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Gerar manifesto
        run: python3 tools/portal_manifesto.py
      - name: Guardar manifesto
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifesto-offline
          path: inicio/manifesto.json
          if-no-files-found: error
          retention-days: 1

  publicar:
    needs: gerar
    # Nunca publique a partir de uma branch de PR ou de execução manual fora de main.
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.repository, 'vfydr2m9wk-ops/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
      - name: Recuperar manifesto gerado
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: manifesto-offline
          path: inicio
      - name: Gravar se mudou
        run: |
          if git diff --quiet -- inicio/manifesto.json; then echo "sem mudanças"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- inicio/manifesto.json
          git commit -m "Atualiza a lista da cópia offline"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep 5
          done
          exit 1

# Builds the test files (simple, medium and complex for each app) with tools/gerar_arquivos_teste.py
# and publishes them to the "arquivos-teste" release, used by windows/teste-arquivos.bat.
name: arquivos-teste
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/gerar_arquivos_teste.py, .github/workflows/arquivos-teste.yml]
permissions:
  contents: write
jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q python-docx openpyxl python-pptx reportlab pillow
      - name: Generate
        run: python3 tools/gerar_arquivos_teste.py simples medio complexo
      - name: List with SHA-256 (level sha256 name)
        run: |
          cd testes/arquivos
          : > lista.txt
          for n in simples medio complexo; do for f in $n/*; do echo "$n $(sha256sum "$f" | cut -d' ' -f1) $(basename "$f")" >> lista.txt; done; done
          cat lista.txt
      - name: Publish to the arquivos-teste release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view arquivos-teste >/dev/null 2>&1 || gh release create arquivos-teste --title "InkDOS Hub test files" --latest=false --notes "Synthetic test files (simple, medium, complex) for the performance test windows/teste-arquivos.bat. Generated by tools/gerar_arquivos_teste.py."
          gh release upload arquivos-teste testes/arquivos/lista.txt testes/arquivos/simples/* testes/arquivos/medio/* testes/arquivos/complexo/* --clobber

name: Build Emulator Linux
# Builds the Emulator › Linux system with tools/linux-gui/build.sh:
# the kernel goes to apps/emulador/linux/, the root disk (too big for git) to the release "linux-gui".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/linux-gui/**, .github/workflows/linux-gui.yml]
permissions:
  contents: write
concurrency:
  group: linux-gui
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -q && sudo apt-get install -yq flex bison bc libelf-dev e2fsprogs
      - name: Build
        run: WORK="$RUNNER_TEMP/work" tools/linux-gui/build.sh
      - name: Publish the disk
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          img="$RUNNER_TEMP/work/linux-gui.img.gz"
          gh release view linux-gui >/dev/null 2>&1 || gh release create linux-gui --title "Emulator Linux disk" --notes "Root disk of Emulator › Linux (Alpine 3.22 x86, Openbox, tint2, PCManFM). Built by .github/workflows/linux-gui.yml."
          gh release upload linux-gui "$img" --clobber
          v=$(sha256sum "$img" | cut -c1-16)
          printf '{"disk":"%s","bytes":%s,"size":%s}\n' "$v" "$(stat -c %s "$img")" "$((3072*1024*1024))" > apps/emulador/linux/disk.json
      - name: Commit
        run: |
          git add apps/emulador/linux/linux-gui-bzImage.bin apps/emulador/linux/disk.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Emulator Linux build"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>InkOS</title>
<link rel="icon" href="../assets/icones-inkdos/inkos.png">
<!-- InkOS lives in its own repository (InkDOSHub/InkOS) and is published at
     inkos-5k7.pages.dev. The Hub only links to it: nothing of InkOS is copied here.
     Query and hash go along (?open=cmdexe opens an app on start). -->
<script>
  (function () {
    var dest = "https://inkos-5k7.pages.dev/" + location.search + location.hash;
    // InkOS opens Hub apps inside its windows; the Hub's InkOS link in there must not nest InkOS.
    if (window.top === window.self) location.replace(dest);
    else document.addEventListener("DOMContentLoaded", function () { document.getElementById("go").target = "_blank"; });
  })();
</script>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font:15px -apple-system,system-ui,sans-serif;background:#1e1e2e;color:#cdd6f4}
  a{color:#cba6f7}
</style>
</head>
<body>
<p><a id="go" href="https://inkos-5k7.pages.dev/">Open InkOS</a></p>
</body>
</html>

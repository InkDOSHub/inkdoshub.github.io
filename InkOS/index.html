<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a6a">
<title>InkOS</title>
<link rel="icon" href="inkos.png">
<style>
  :root {
    --bg: #f5f5f5;
    --paper: #ffffff;
    --ink: #2b2b2b;
    --muted: #666666;
    --line: #e0e0e0;
    --line-2: #d0d0d0;
    --hover: #f0f0f0;
    --hover-2: #e8e8e8;
    --sel: #d4e4f7;
    --blue: #2b6fb9;
    --title: #f0f0f0;
    --close: #f0506e;
    --panel: #f6f5f4;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font: 13px/1.4 "Noto Sans", "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    overflow: hidden;
    background: #2a2148;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .desk {
    position: relative;
    height: 100%;
    background:
      radial-gradient(90% 70% at 78% 88%, #ffb48a 0%, rgba(255,180,138,0) 58%),
      radial-gradient(70% 55% at 18% 28%, #6a4d96 0%, rgba(106,77,150,0) 60%),
      linear-gradient(155deg, #3d2d72 0%, #8a4e62 38%, #e08a62 62%, #c46b78 100%);
  }
  .desk::before, .desk::after {
    content: "";
    position: absolute;
    left: -10%;
    right: -10%;
    height: 28%;
    border-radius: 50%;
    pointer-events: none;
  }
  .desk::before { bottom: 18%; background: rgba(255,160,120,.28); filter: blur(8px); }
  .desk::after { bottom: 6%; background: rgba(90,40,80,.25); }
  .win {
    position: absolute;
    min-width: 320px;
    min-height: 240px;
    background: var(--paper);
    border: 1px solid #cfcfcf;
    border-radius: 6px;
    box-shadow: 0 10px 28px rgba(30, 16, 40, .28);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .win.max { left: 8px !important; top: 8px !important; right: 8px; bottom: 56px; width: auto !important; height: auto !important; }
  .win.min { display: none; }
  .titlebar {
    height: 32px;
    flex: none;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 6px 0 10px;
    background: var(--title);
    border-bottom: 1px solid var(--line);
    user-select: none;
    touch-action: none;
  }
  .titlebar strong { font-weight: 600; font-size: 13px; }
  .titlebar .sp { flex: 1; }
  .wc {
    width: 24px; height: 24px; padding: 0;
    border: 0; border-radius: 4px; background: transparent; color: #444;
  }
  .wc:hover { background: var(--hover-2); }
  .wc.close:hover { background: var(--close); color: #fff; }
  .dolphin { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  .nav {
    height: 36px; flex: none;
    display: flex; align-items: center; gap: 4px;
    padding: 0 6px;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
  }
  .nav button, .tool {
    width: 32px; height: 32px; border: 0; border-radius: 4px; background: transparent;
  }
  .nav button:hover, .tool:hover { background: var(--hover); }
  .addr {
    flex: 1; height: 28px;
    border: 1px solid var(--line); border-radius: 4px;
    padding: 0 8px; background: #fff;
  }
  .addr:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(43,111,185,.12); }
  .body { display: flex; min-height: 0; flex: 1; }
  .side {
    width: 168px; flex: none;
    background: var(--bg);
    border-right: 1px solid var(--line);
    overflow: auto;
    padding: 6px 0;
  }
  .side h3 {
    margin: 8px 12px 4px;
    font-size: 11px; font-weight: 600; color: var(--muted);
  }
  .place, .kick-item {
    display: flex; align-items: center; gap: 8px;
    width: 100%; text-align: left;
    border: 0; background: transparent;
    padding: 6px 12px; border-radius: 0;
  }
  .place:hover, .kick-item:hover { background: var(--hover-2); }
  .place.on, .kick-item.on { background: var(--sel); color: var(--blue); }
  .main { flex: 1; overflow: auto; padding: 8px; background: #fff; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 104px);
    gap: 4px 8px;
  }
  .item {
    border: 0; background: transparent;
    border-radius: 4px;
    padding: 8px 4px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .item:hover { background: var(--hover); }
  .item.on { background: var(--sel); color: var(--blue); }
  .item span { font-size: 11px; text-align: center; max-width: 92px; word-break: break-word; }
  .status {
    height: 24px; flex: none;
    display: flex; align-items: center;
    padding: 0 8px;
    background: var(--bg);
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }
  .panel {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 40;
    height: 44px;
    display: flex; align-items: center; gap: 6px;
    padding: 0 8px env(safe-area-inset-bottom);
    background: rgba(246,245,244,.94);
    border-top: 1px solid #ddd;
    backdrop-filter: blur(8px);
  }
  .launcher, .task, .tray {
    height: 32px; border: 0; border-radius: 4px; background: transparent;
  }
  .launcher { width: 36px; }
  .launcher.on, .task.on { background: var(--sel); color: var(--blue); }
  .task { padding: 0 10px; max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .task:hover, .launcher:hover, .tray:hover { background: var(--hover); }
  .tasks { display: flex; gap: 4px; flex: 1; min-width: 0; }
  .clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink); padding-right: 4px; }
  .kick {
    position: absolute; left: 8px; bottom: 52px; z-index: 50;
    width: min(680px, calc(100% - 16px));
    height: min(460px, calc(100% - 70px));
    background: var(--paper);
    border: 1px solid #cfcfcf;
    border-radius: 8px;
    box-shadow: 0 16px 40px rgba(30,16,40,.32);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .kick[hidden] { display: none; }
  .kick-top { display: flex; min-height: 0; flex: 1; }
  .kick-side { width: 176px; background: var(--bg); border-right: 1px solid var(--line); overflow: auto; padding: 8px 0; }
  .kick-main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fbf8f6; }
  .search {
    margin: 10px 12px 6px;
    height: 28px; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 8px; background: #fff;
  }
  .search:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(43,111,185,.12); }
  .apps { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; overflow: auto; align-content: flex-start; }
  .app {
    width: 96px; border: 0; background: transparent; border-radius: 6px;
    padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  }
  .app:hover { background: var(--hover); }
  .app.on { background: var(--sel); color: var(--blue); }
  .app b { font-weight: 400; font-size: 12px; text-align: center; }
  .kick-foot {
    height: 40px; flex: none;
    display: flex; align-items: center; gap: 4px;
    padding: 0 8px;
    border-top: 1px solid var(--line);
    background: var(--bg);
    overflow: auto;
  }
  .kick-foot button {
    border: 0; background: transparent; border-radius: 4px;
    padding: 6px 8px; white-space: nowrap;
  }
  .kick-foot button:hover { background: var(--hover-2); }
  .glyph { width: 64px; height: 64px; display: block; }
  .glyph.sm { width: 16px; height: 16px; }
  .glyph.md { width: 40px; height: 40px; }
  .about { padding: 16px 18px; overflow: auto; }
  .about h2 { margin: 0 0 8px; font-size: 16px; }
  .about p { margin: 0 0 8px; }
  .about a { color: var(--blue); }
  @media (max-width: 800px) {
    .win, .win.max { left: 0 !important; top: 0 !important; right: 0; width: auto !important; height: auto !important; bottom: 52px; border-radius: 0; min-width: 0; }
    .side { width: 46px; }
    .side h3, .place span { display: none; }
    .place { justify-content: center; padding: 8px 0; }
    .kick { left: 0; right: 0; width: auto; bottom: 52px; height: calc(100% - 52px); border-radius: 0; }
    .kick-side { width: 52px; }
    .kick-item span { display: none; }
    .kick-item { justify-content: center; padding: 10px 0; }
  }
</style>
</head>
<body>
<div class="desk" id="desk">
  <section class="win" id="win-files" style="left:34%;top:7%;width:62%;height:72%">
    <header class="titlebar" data-drag>
      <strong id="wtitle">Home — Files</strong>
      <span class="sp"></span>
      <button class="wc" data-min="files" title="Minimize">–</button>
      <button class="wc" data-max="files" title="Maximize">□</button>
      <button class="wc close" data-close="files" title="Close">×</button>
    </header>
    <div class="dolphin">
      <div class="nav">
        <button type="button" id="back" title="Back">←</button>
        <button type="button" id="up" title="Up">↑</button>
        <input class="addr" id="addr" value="Home" aria-label="Location">
        <button class="tool" id="search-files" title="Search">⌕</button>
      </div>
      <div class="body">
        <aside class="side" id="places"></aside>
        <div class="main"><div class="grid" id="grid"></div></div>
      </div>
      <footer class="status" id="status">0 items</footer>
    </div>
  </section>

  <section class="win min" id="win-about" style="left:8%;top:10%;width:440px;height:280px">
    <header class="titlebar" data-drag>
      <strong>About InkOS</strong>
      <span class="sp"></span>
      <button class="wc" data-min="about" title="Minimize">–</button>
      <button class="wc" data-max="about" title="Maximize">□</button>
      <button class="wc close" data-close="about" title="Close">×</button>
    </header>
    <div class="about">
      <h2>InkOS</h2>
      <p>Desktop shell in the Breeze style. Files stay in this tab. The x86 engine is still <a href="../InkSoC/">InkSoC</a>, and the other Hub apps are unchanged.</p>
      <p><a href="../">Back to InkDOS Hub</a> · <a href="https://github.com/InkDOSHub/InkOS">Source</a></p>
    </div>
  </section>

  <div class="kick" id="kick" hidden>
    <div class="kick-top">
      <nav class="kick-side" id="cats"></nav>
      <div class="kick-main">
        <input class="search" id="q" placeholder="Search…" aria-label="Search applications">
        <div class="apps" id="apps"></div>
      </div>
    </div>
    <div class="kick-foot">
      <button type="button" data-power="apps">Applications</button>
      <button type="button" data-power="places">Places</button>
      <button type="button" data-power="sleep">Sleep</button>
      <button type="button" data-power="restart">Restart</button>
      <button type="button" data-power="off">Shut Down</button>
    </div>
  </div>

  <footer class="panel">
    <button class="launcher" id="launch" title="Applications" aria-label="Applications">
      <svg class="glyph sm" viewBox="0 0 16 16" aria-hidden="true"><path fill="#2b6fb9" d="M1 1h6v6H1zM9 1h6v6H9zM1 9h6v6H1z"/><path fill="#3d8fd4" d="M9 9h6v6H9z"/></svg>
    </button>
    <div class="tasks" id="tasks"></div>
    <time class="clock" id="clock"></time>
  </footer>
</div>
<script>
(function () {
  "use strict";
  var folder = '<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><path fill="#2b6fb9" d="M6 16h18l6 6h28v30H6z"/><path fill="#5aa0e0" d="M6 24h52v28H6z"/></svg>';
  var folderSm = '<svg class="glyph sm" viewBox="0 0 16 16" aria-hidden="true"><path fill="#2b6fb9" d="M1 3h6l2 2h6v8H1z"/></svg>';
  var file = '<svg class="glyph" viewBox="0 0 64 64" aria-hidden="true"><path fill="#f4f4f4" stroke="#8a8a8a" d="M16 6h22l12 12v40H16z"/><path fill="#d0d0d0" d="M38 6v12h12"/></svg>';
  var icons = {
    folder: folder,
    files: folder,
    monitor: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="8" width="36" height="24" rx="2" fill="#3b5bdb" stroke="#111" stroke-width="2"/><rect x="10" y="12" width="28" height="16" fill="#efe9dc"/><path stroke="#111" stroke-width="2" d="M24 32v6M16 40h16"/></svg>',
    term: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="8" width="36" height="32" rx="3" fill="#1b1f1a"/><path stroke="#7dcea0" stroke-width="2" d="M12 18l6 6-6 6M22 32h12"/></svg>',
    doc: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" stroke="#2b6fb9" stroke-width="2" d="M12 6h16l8 8v28H12z"/><path stroke="#2b6fb9" d="M16 22h16M16 28h16M16 34h10"/></svg>',
    pdf: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" stroke="#c0392b" stroke-width="2" d="M12 6h16l8 8v28H12z"/><path fill="#c0392b" d="M16 30h16v6H16z"/></svg>',
    photo: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="10" width="36" height="28" rx="3" fill="#5aa0e0"/><circle cx="18" cy="20" r="4" fill="#ffe08a"/><path fill="#2b6fb9" d="M6 30l10-8 8 6 6-4 12 10v4H6z"/></svg>',
    music: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><path fill="#2b6fb9" d="M18 8h6v22a8 8 0 1 1-4-7V12h-2z"/></svg>',
    video: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="12" width="26" height="24" rx="3" fill="#3d4a5c"/><path fill="#e25b2a" d="M32 20l10-6v20l-10-6z"/></svg>',
    code: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><path stroke="#2b6fb9" stroke-width="3" fill="none" d="M18 14l-8 10 8 10M30 14l8 10-8 10"/></svg>',
    zip: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><path fill="#e6b325" d="M10 6h18l10 10v26H10z"/><path fill="#2b2b2b" d="M22 8h4v4h-4zm0 8h4v4h-4z"/></svg>',
    cam: '<svg class="glyph md" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="14" width="24" height="18" rx="3" fill="#3d4a5c"/><circle cx="18" cy="23" r="5" fill="#9fd0ff"/><path fill="#2b6fb9" d="M30 20l12-6v20L30 28z"/></svg>'
  };
  var tree = {
    Home: [
      { n: "Desktop", k: "folder", go: "Desktop" },
      { n: "Documents", k: "folder", go: "Documents" },
      { n: "Downloads", k: "folder", go: "Downloads" },
      { n: "Music", k: "folder", go: "Music" },
      { n: "Pictures", k: "folder", go: "Pictures" },
      { n: "Public", k: "folder", go: "Public" },
      { n: "Templates", k: "folder", go: "Templates" },
      { n: "Videos", k: "folder", go: "Videos" }
    ],
    Desktop: [
      { n: "InkSoC", k: "file", href: "../InkSoC/" },
      { n: "Terminal", k: "file", href: "../InkShell/" },
      { n: "Hub", k: "file", href: "../" }
    ],
    Documents: [{ n: "Notes.txt", k: "file" }, { n: "Readme.txt", k: "file" }],
    Downloads: [{ n: "inkos.png", k: "file", href: "inkos.png" }],
    Music: [], Pictures: [], Public: [], Templates: [], Videos: [], Trash: []
  };
  var places = ["Home", "Desktop", "Documents", "Downloads", "Music", "Pictures", "Videos", "Trash"];
  var apps = [
    { n: "Files", c: ["fav", "all"], ic: "files", open: "files" },
    { n: "InkSoC", c: ["fav", "all", "sys"], ic: "monitor", href: "../InkSoC/" },
    { n: "Terminal", c: ["fav", "all", "dev"], ic: "term", href: "../InkShell/" },
    { n: "Documents", c: ["fav", "all", "off"], ic: "doc", href: "../apps/wordcraft/" },
    { n: "Spreadsheets", c: ["all", "off"], ic: "doc", href: "../apps/gridcraft/" },
    { n: "Presentations", c: ["all", "off"], ic: "doc", href: "../apps/deckcraft/" },
    { n: "PDF", c: ["all", "off"], ic: "pdf", href: "../inkdos/apps/pdf/index.html?suite=1" },
    { n: "Photos", c: ["all", "mul"], ic: "photo", href: "../apps/foto/" },
    { n: "Music", c: ["all", "mul"], ic: "music", href: "../apps/musica/" },
    { n: "Video", c: ["all", "mul"], ic: "video", href: "../apps/video/" },
    { n: "Code", c: ["all", "dev"], ic: "code", href: "../apps/codigo/" },
    { n: "Zip", c: ["all", "util"], ic: "zip", href: "../apps/zip/" },
    { n: "Webcam", c: ["all", "mul"], ic: "cam", href: "../InkCam/" },
    { n: "About", c: ["all", "help"], ic: "monitor", open: "about" }
  ];
  var cats = [
    ["fav", "Favorites"], ["all", "All Applications"], ["dev", "Development"],
    ["mul", "Multimedia"], ["off", "Office"], ["sys", "System"],
    ["util", "Utilities"], ["help", "Help"]
  ];
  var here = "Home", hist = [], sel = -1, cat = "fav", z = 2;
  var $ = function (id) { return document.getElementById(id); };
  function icon(name, cls) {
    var s = icons[name] || folder;
    return cls ? s.replace('class="glyph', 'class="glyph ' + cls) : s;
  }
  function openWin(id) {
    var w = $("win-" + id);
    w.classList.remove("min");
    w.style.zIndex = ++z;
    renderTasks();
  }
  function renderPlaces() {
    $("places").innerHTML = "<h3>Places</h3>" + places.map(function (p) {
      return '<button type="button" class="place' + (p === here ? " on" : "") + '" data-place="' + p + '">' + folderSm + "<span>" + p + "</span></button>";
    }).join("");
  }
  function renderGrid() {
    var list = tree[here] || [];
    var q = ($("addr").dataset.find || "").toLowerCase();
    if (q) list = list.filter(function (it) { return it.n.toLowerCase().indexOf(q) >= 0; });
    $("wtitle").textContent = here + " — Files";
    $("addr").value = here;
    $("grid").innerHTML = list.map(function (it, i) {
      return '<button type="button" class="item' + (i === sel ? " on" : "") + '" data-i="' + i + '">' +
        (it.k === "folder" ? folder : file) + "<span>" + it.n + "</span></button>";
    }).join("");
    $("status").textContent = list.length + (list.length === 1 ? " item" : " items");
    $("grid").dataset.len = String(list.length);
  }
  function enter(i) {
    var it = (tree[here] || [])[i];
    if (!it) return;
    if (it.go) { hist.push(here); here = it.go; sel = -1; renderPlaces(); renderGrid(); }
    else if (it.href) location.href = it.href;
  }
  function renderCats() {
    $("cats").innerHTML = cats.map(function (c) {
      return '<button type="button" class="kick-item' + (c[0] === cat ? " on" : "") + '" data-cat="' + c[0] + '">' + folderSm + "<span>" + c[1] + "</span></button>";
    }).join("");
  }
  function renderApps() {
    var q = $("q").value.trim().toLowerCase();
    var list = apps.filter(function (a) {
      if (q) return a.n.toLowerCase().indexOf(q) >= 0;
      return a.c.indexOf(cat) >= 0;
    });
    $("apps").innerHTML = list.map(function (a) {
      return '<button type="button" class="app" data-app="' + a.n + '">' + icon(a.ic, "md") + "<b>" + a.n + "</b></button>";
    }).join("") || '<p style="padding:12px;color:#666">No applications</p>';
  }
  function renderTasks() {
    $("tasks").innerHTML = ["files", "about"].filter(function (id) {
      return !$("win-" + id).classList.contains("min") || $("win-" + id).dataset.was === "1";
    }).map(function (id) {
      var w = $("win-" + id);
      var on = !w.classList.contains("min");
      var name = id === "files" ? "Files" : "About InkOS";
      return '<button type="button" class="task' + (on ? " on" : "") + '" data-task="' + id + '">' + name + "</button>";
    }).join("");
  }
  function tick() {
    var d = new Date();
    $("clock").textContent = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  }
  $("places").onclick = function (e) {
    var b = e.target.closest("[data-place]");
    if (!b) return;
    hist.push(here); here = b.dataset.place; sel = -1; renderPlaces(); renderGrid();
  };
  $("grid").onclick = function (e) {
    var b = e.target.closest("[data-i]");
    if (!b) return;
    var i = +b.dataset.i;
    var it = (tree[here] || [])[i];
    sel = i;
    if (it && (it.go || it.href)) enter(i);
    else renderGrid();
  };
  $("grid").ondblclick = function (e) {
    var b = e.target.closest("[data-i]");
    if (b) enter(+b.dataset.i);
  };
  $("back").onclick = function () { if (!hist.length) return; here = hist.pop(); sel = -1; renderPlaces(); renderGrid(); };
  $("up").onclick = function () { if (here === "Home") return; hist.push(here); here = "Home"; sel = -1; renderPlaces(); renderGrid(); };
  $("addr").onchange = function () {
    var v = $("addr").value.trim();
    if (tree[v]) { hist.push(here); here = v; sel = -1; renderPlaces(); renderGrid(); }
    else { $("addr").dataset.find = v; renderGrid(); $("addr").dataset.find = ""; }
  };
  $("search-files").onclick = function () { $("addr").focus(); $("addr").select(); };
  document.querySelectorAll("[data-drag]").forEach(function (bar) {
    bar.addEventListener("pointerdown", function (e) {
      if (e.target.closest(".wc")) return;
      var win = bar.parentElement;
      if (win.classList.contains("max")) return;
      win.style.zIndex = ++z;
      var r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
      bar.setPointerCapture(e.pointerId);
      function move(ev) {
        win.style.left = Math.max(0, ev.clientX - dx) + "px";
        win.style.top = Math.max(0, ev.clientY - dy) + "px";
      }
      function up() { bar.removeEventListener("pointermove", move); bar.removeEventListener("pointerup", up); }
      bar.addEventListener("pointermove", move);
      bar.addEventListener("pointerup", up);
    });
  });
  document.body.addEventListener("click", function (e) {
    var t = e.target.closest("[data-min],[data-max],[data-close]");
    if (!t) return;
    var id = t.dataset.min || t.dataset.max || t.dataset.close;
    var w = $("win-" + id);
    if (t.dataset.min) { w.dataset.was = "1"; w.classList.add("min"); }
    else if (t.dataset.max) w.classList.toggle("max");
    else { w.classList.add("min"); w.dataset.was = ""; }
    renderTasks();
  });
  $("tasks").onclick = function (e) {
    var b = e.target.closest("[data-task]");
    if (!b) return;
    var w = $("win-" + b.dataset.task);
    if (w.classList.contains("min")) openWin(b.dataset.task);
    else { w.dataset.was = "1"; w.classList.add("min"); renderTasks(); }
  };
  function toggleKick(force) {
    var k = $("kick");
    var show = force === undefined ? k.hidden : force;
    k.hidden = !show;
    $("launch").classList.toggle("on", show);
    if (show) $("q").focus();
  }
  $("launch").onclick = function () { toggleKick(); };
  $("cats").onclick = function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    cat = b.dataset.cat; renderCats(); renderApps();
  };
  $("q").oninput = renderApps;
  $("apps").onclick = function (e) {
    var b = e.target.closest("[data-app]");
    if (!b) return;
    var a = apps.filter(function (x) { return x.n === b.dataset.app; })[0];
    if (!a) return;
    if (a.href) { location.href = a.href; return; }
    if (a.open) { toggleKick(false); openWin(a.open); }
  };
  $("kick").querySelector(".kick-foot").onclick = function (e) {
    var b = e.target.closest("[data-power]");
    if (!b) return;
    var p = b.dataset.power;
    if (p === "apps") { cat = "all"; renderCats(); renderApps(); }
    else if (p === "places") { toggleKick(false); openWin("files"); }
    else if (p === "sleep") { document.querySelectorAll(".win").forEach(function (w) { w.dataset.was = "1"; w.classList.add("min"); }); renderTasks(); toggleKick(false); }
    else if (p === "restart") location.reload();
    else if (p === "off") location.href = "../";
  };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") toggleKick(false); });
  document.addEventListener("pointerdown", function (e) {
    if ($("kick").hidden) return;
    if (e.target.closest("#kick") || e.target.closest("#launch")) return;
    toggleKick(false);
  });
  tick(); setInterval(tick, 10000);
  renderPlaces(); renderGrid(); renderCats(); renderApps(); renderTasks();
  if (matchMedia("(max-width: 800px)").matches) $("win-files").classList.add("max");
})();
</script>
</body>
</html>

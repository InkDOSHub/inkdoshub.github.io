<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InkTerminal">
<title>InkTerminal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230d1117%22/%3E%3Cpath d=%22M8 10l6 6-6 6M16 22h8%22 stroke=%22%233fb950%22 stroke-width=%223%22 fill=%22none%22/%3E%3C/svg%3E">
<script src="../assets/tema.js"></script>
<link rel="stylesheet" href="../assets/barra.css?v=1">
<link rel="stylesheet" href="vendor/xterm/xterm.css">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body class="ink-app">
<header class="ink-bar" id="topbar">
  <a class="ink-home" href="../">‹ InkTerminal</a>
  <span class="ink-title">Linux</span>
  <span class="ink-status" id="status">Carregando…</span>
  <span class="ink-spacer"></span>
  <button class="ink-btn" id="rede" title="Como o Linux acessa a internet (toque para trocar)">Rede: wisp</button>
  <button class="ink-btn" id="btn-upload" title="Enviar arquivos do iPad para ~/ipad">Enviar</button>
  <button class="ink-btn" id="btn-download" title="Baixar arquivos de ~/ipad">Baixar</button>
  <button class="ink-btn" id="btn-save" title="Salvar o estado da máquina neste navegador">Salvar</button>
  <button class="ink-btn" id="btn-reset" title="Apagar o estado salvo e reiniciar do zero">Reiniciar</button>
</header>
<main class="ink-main" id="term"></main>
<nav id="keys" class="ink-keys" aria-label="Teclas extras">
  <button class="ink-btn" data-key="esc">Esc</button>
  <button class="ink-btn" data-key="tab">Tab</button>
  <button class="ink-btn" data-key="ctrl" id="key-ctrl">Ctrl</button>
  <button class="ink-btn" data-key="up">↑</button>
  <button class="ink-btn" data-key="down">↓</button>
  <button class="ink-btn" data-key="left">←</button>
  <button class="ink-btn" data-key="right">→</button>
  <button class="ink-btn" data-text="|">|</button>
  <button class="ink-btn" data-text="/">/</button>
  <button class="ink-btn" data-text="-">-</button>
  <button class="ink-btn" data-text="~">~</button>
  <button class="ink-btn" data-key="ctrl-c">^C</button>
</nav>
<input type="file" id="file-picker" multiple hidden>
<dialog id="download-dialog">
  <h2>Baixar da pasta ~/ipad</h2>
  <div id="download-list"></div>
  <button class="ink-btn" id="download-close">Fechar</button>
</dialog>
<script type="module" src="app.js?v=5"></script>
</body>
</html>

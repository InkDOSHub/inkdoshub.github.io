  <style id="pptLook">
/* Look close to PowerPoint: ribbon in named groups, numbered thumbnails on the left and highlighted slide. */
.editbar{align-items:stretch;gap:0;padding-top:4px;padding-bottom:2px;background:var(--panel)}
.editbar .ppt-grupo{position:relative;padding:0 6px 16px;border-right:1px solid var(--line);align-items:center}
.editbar .ppt-grupo:last-of-type{border-right:0}
.editbar .grupo-nome{position:absolute;left:0;right:0;bottom:0;font-size:11px;line-height:15px;color:var(--muted);text-align:center;white-space:nowrap;pointer-events:none}
@media(max-width:720px){.editbar .ppt-grupo{padding-bottom:0}.editbar .grupo-nome{display:none}}
:root:not([data-appearance-resolved="dark"]) .content-viewport{background:#e3e4e8}
.slide-canvas{box-shadow:0 0 0 1px rgba(0,0,0,.07),0 2px 6px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.10)}
@media (orientation:landscape),(min-width:700px){
 .slide-panel{background:var(--panel)}
 .slide-panel-inner{gap:6px;padding:10px 8px 10px 4px}
 .slide-thumb{display:grid;grid-template-columns:22px minmax(0,1fr);align-items:start;border:0;background:none;padding:2px;box-shadow:none}
 .slide-thumb .thumb-index{grid-column:1;grid-row:1;margin:2px 0 0;text-align:center;font-size:12px}
 .slide-thumb .thumb-paper{grid-column:2;grid-row:1}
 .slide-thumb.active{background:none;box-shadow:none}
 .slide-thumb.active .thumb-paper{outline:2px solid var(--accent);outline-offset:2px}
 .slide-thumb.active .thumb-index{color:var(--accent);font-weight:600}
}
</style>

<script>
(function presentationStartGate(){
  const state=document.getElementById('startState');
  const startNew=document.getElementById('startNew');
  const startOpen=document.getElementById('startOpen');
  const fileInput=document.getElementById('fileInput');
  const menuNew=document.getElementById('newMenuBtn');
  const app=globalThis.__inkdosPresentations;
  if(!state||!startNew||!startOpen||!fileInput||!app)return;

  function showStart(){
    state.hidden=false;
    state.removeAttribute('hidden');
    state.dataset.active='true';
    state.style.setProperty('display','grid','important');
  }
  function hideStart(){
    state.dataset.active='false';
    state.style.removeProperty('display');
    state.hidden=true;
  }
  function waitForOpenCommit(beforeRevision){
    let frames=0;
    function check(){
      const kind=app.session.sourceKind;
      if((kind==='ppt'||kind==='pptx')&&app.session.revision>beforeRevision){hideStart();return}
      if(++frames<900&&state.dataset.active==='true')requestAnimationFrame(check);
    }
    requestAnimationFrame(check);
  }

  /* The presentation engine creates its blank slide model during construction.
     Keep that implementation untouched and place a deterministic first-open gate
     above it until the user explicitly chooses New or a file open commits. */
  showStart();

  startNew.addEventListener('click',()=>{
    const accepted=app.newPresentation();
    if(accepted!==false)hideStart();
  });
  startOpen.addEventListener('click',()=>fileInput.click());

  fileInput.addEventListener('change',()=>{
    if(fileInput.files&&fileInput.files.length)waitForOpenCommit(app.session.revision);
  });

  if(menuNew)menuNew.addEventListener('click',()=>{
    const before=app.session.revision;
    setTimeout(()=>{if(app.session.sourceKind==='new'&&app.session.revision>before)hideStart()},0);
  },true);

  document.addEventListener('keydown',event=>{
    if(state.dataset.active!=='true'||!(event.metaKey||event.ctrlKey)||event.key.toLowerCase()!=='n')return;
    const before=app.session.revision;
    setTimeout(()=>{if(app.session.sourceKind==='new'&&app.session.revision>before)hideStart()},0);
  },true);
})();
</script>
